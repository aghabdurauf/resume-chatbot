services:
  - type: web
    name: resume-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_web:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --log-level info --access-logfile - --error-logfile -
    envVars:
      - key: GROQ_API_KEY
        sync: false
